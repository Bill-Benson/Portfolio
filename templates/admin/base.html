<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>{% block title %}Admin{% endblock %} - Bill Benson</title>
		<meta name="robots" content="noindex, nofollow" />
		<meta name="theme-color" content="#0a0f16" />
		<link rel="stylesheet" href="{{ url_for('static', filename='assets/css/site.css') }}" />
		<link rel="stylesheet" href="{{ url_for('static', filename='assets/css/admin.css') }}" />
		<link rel="shortcut icon" href="{{ url_for('static', filename='images/favicon.ico') }}" />
	</head>
	<body>
		<nav class="site-nav" aria-label="Admin">
			<div class="nav-inner">
				<a class="nav-logo" href="{{ url_for('admin.dashboard') }}"><span class="prompt">~#</span> admin</a>
				{% if session.get('admin_at') %}
				<form class="admin-logout" method="post" action="{{ url_for('admin.logout') }}">
					<input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
					<a href="/" target="_blank" rel="noopener">View site</a>
					<button type="submit" class="btn btn-ghost">Log out</button>
				</form>
				{% endif %}
			</div>
		</nav>

		<main id="main" class="blog-main">
			{% block content %}{% endblock %}
		</main>
	</body>
</html>
